/* WattOdds — energy yield uncertainty, source to meter.

/* Layout: the left rail is the uncertainty chain itself — measurement at the top, the point of
   interconnection at the bottom — and doubles as navigation. The worksheet sits in the middle and
   the live P-values on the right. On a phone the chain becomes a scrolling strip and the result a bottom bar. */
:root {
  --paper: #f2f5f5;
  --surface: #ffffff;
  --sunk: #e8edee;
  --ink: #10212a;
  --ink-2: #44565f;
  --ink-3: #66777f;
  --line: #d5dde0;
  --line-2: #b9c5ca;
  --accent: #d9480f;
  --accent-ink: #b23a0b;
  --accent-wash: #fcebe2;
  --ev-calc: #104281;
  --ev-site: #256abf;
  --ev-desc: #5598e7;
  --ev-generic: #86b6ef;
  --ev-none: #c4ccd0;
  --series: #2a78d6;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a;
  --warn-ink: #8a5a00;
  --warn-wash: #fff4d6;
  --crit: #d03b3b;
  --shadow: 0 1px 2px rgba(16, 33, 42, 0.06), 0 6px 24px rgba(16, 33, 42, 0.06);
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --rail-w: 236px;
  --side-w: 300px;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1418; --surface: #111d22; --sunk: #0d181c; --ink: #e3ecee; --ink-2: #a9b9be; --ink-3: #8193a0;
    --line: #22333a; --line-2: #31464e; --accent: #ff6b35; --accent-ink: #ff8f63; --accent-wash: #331a10;
    --ev-calc: #9ec5f4; --ev-site: #5598e7; --ev-desc: #2a78d6; --ev-generic: #184f95; --ev-none: #3a4a50;
    --series: #3987e5; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --warn-ink: #f2c45c; --warn-wash: #2c2410; --crit: #e66767;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1418; --surface: #111d22; --sunk: #0d181c; --ink: #e3ecee; --ink-2: #a9b9be; --ink-3: #8193a0;
  --line: #22333a; --line-2: #31464e; --accent: #ff6b35; --accent-ink: #ff8f63; --accent-wash: #331a10;
  --ev-calc: #9ec5f4; --ev-site: #5598e7; --ev-desc: #2a78d6; --ev-generic: #184f95; --ev-none: #3a4a50;
  --series: #3987e5; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --warn-ink: #f2c45c; --warn-wash: #2c2410; --crit: #e66767;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); font-stretch: 112%; text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.6rem; font-weight: 750; letter-spacing: -0.01em; }
h3 { font-size: 1.02rem; font-weight: 700; }
h4 { font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
p { margin: 0; }
code, .mono { font-family: var(--f-mono); font-size: 0.78rem; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { display: flex; align-items: center; gap: 14px; min-height: var(--top-h); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand-name { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 1.12rem; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap; }
.brand-name .odds { color: var(--accent-ink); }
.brand-mark { color: var(--ink); }
.brand-sub { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-3); white-space: nowrap; }
.proj { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; }
.proj-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--warn-wash); color: var(--warn-ink); white-space: nowrap; }
.tag.save { background: var(--sunk); color: var(--ink-2); font-weight: 500; }
.actions { display: flex; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 0.86rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 4px 9px; font-size: 0.8rem; }
.btn.danger { color: var(--crit); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---------- frame ---------- */
.frame { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--side-w); gap: 0; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); max-height: calc(100vh - var(--top-h)); overflow-y: auto; padding: 20px 0 32px max(16px, env(safe-area-inset-left, 0px)); }
.sheet { min-width: 0; padding: 24px 28px 120px; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); max-height: calc(100vh - var(--top-h)); overflow-y: auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 32px 0; }

/* ---------- chain rail ---------- */
.chain { list-style: none; margin: 0; padding: 0; position: relative; }
.chain::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; width: 2px; background: repeating-linear-gradient(to bottom, var(--line-2) 0 10px, var(--line) 10px 20px); }
.chain li { position: relative; }
.stage-btn { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left; padding: 7px 10px 7px 0; border-radius: 8px; cursor: pointer; }
.stage-btn:hover .stage-label { color: var(--ink); }
.node { width: 24px; height: 24px; display: grid; place-items: center; position: relative; z-index: 1; }
.node i { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-2); display: block; }
.stage-btn[aria-current="step"] .node i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-wash); }
.stage-label { font-weight: 600; font-size: 0.9rem; color: var(--ink-2); line-height: 1.2; }
.stage-btn[aria-current="step"] .stage-label { color: var(--ink); font-weight: 700; }
.stage-sig { font-family: var(--f-mono); font-size: 0.74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.stage-btn[aria-current="step"] .stage-sig { color: var(--ink); }
.chain .grp { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: 14px 0 4px 34px; }
.rail-foot { margin-top: 18px; padding: 12px 10px 0 34px; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--ink-3); }

/* ---------- side result ---------- */
.res-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.hz { display: flex; background: var(--sunk); border-radius: 8px; padding: 3px; gap: 2px; }
.hz button { flex: 1; border: 0; background: transparent; padding: 6px 4px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.hz button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; }
.kv dt { color: var(--ink-2); font-size: 0.85rem; }
.kv dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.92rem; text-align: right; }
.hero { display: grid; gap: 2px; }
.hero .lbl { font-size: 0.8rem; color: var(--ink-2); }
.hero .big { font-family: var(--f-display); font-stretch: 105%; font-weight: 800; font-size: 2.3rem; line-height: 1; letter-spacing: -0.02em; }
.hero .big small { font-size: 0.95rem; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.hero .sub { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink-2); }
.ratio { color: var(--accent-ink); }
.mixbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--surface); }
.mixbar span { display: block; height: 100%; min-width: 0; }
.ev-calc { background: var(--ev-calc); } .ev-site { background: var(--ev-site); } .ev-desc { background: var(--ev-desc); } .ev-generic { background: var(--ev-generic); }
.ev-none { background: repeating-linear-gradient(135deg, var(--ev-none) 0 3px, transparent 3px 6px); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.76rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.side-note { font-size: 0.78rem; color: var(--ink-3); }

/* ---------- stage header ---------- */
.stage-head { display: grid; gap: 10px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.eyebrow { font-family: var(--f-mono); font-size: 0.74rem; color: var(--ink-3); letter-spacing: 0.04em; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.stage-blurb { color: var(--ink-2); max-width: 64ch; }
.stage-stat { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
.stage-stat b { font-family: var(--f-mono); font-size: 1.05rem; }
.stage-stat span { color: var(--ink-2); font-size: 0.86rem; }

/* ---------- panels and forms ---------- */
.stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 16px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lab { font-size: 0.82rem; color: var(--ink-2); font-weight: 600; line-height: 1.3; }
.field .hint { font-size: 0.76rem; color: var(--ink-3); }
.inp { display: flex; align-items: stretch; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); overflow: hidden; min-width: 0; }
.inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.inp input, .inp select, textarea.ta, input.txt { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 10px; font: inherit; font-family: var(--f-mono); font-size: 0.92rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.inp select { font-family: var(--f-body); font-size: 0.9rem; cursor: pointer; }
.inp input:focus, .inp select:focus { outline: none; }
.inp .unit { display: grid; place-items: center; padding: 0 10px; font-size: 0.78rem; color: var(--ink-3); background: var(--sunk); border-left: 1px solid var(--line); font-family: var(--f-mono); }
input.txt { border: 1px solid var(--line-2); border-radius: 8px; font-family: var(--f-body); }
input.txt:focus, textarea.ta:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
textarea.ta { border: 1px solid var(--line-2); border-radius: 8px; width: 100%; min-height: 140px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line-2); background: var(--surface); padding: 6px 11px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.computed { font-family: var(--f-mono); font-size: 0.86rem; color: var(--ink-2); }
.computed b { color: var(--ink); }
.note { font-size: 0.82rem; color: var(--ink-2); background: var(--sunk); border-radius: 8px; padding: 10px 12px; }
.warn { font-size: 0.84rem; color: var(--warn-ink); background: var(--warn-wash); border-radius: 8px; padding: 10px 12px; }

/* ---------- item cards ---------- */
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.item.off { background: transparent; border-style: dashed; }
.item-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: start; }
.item-title { display: grid; gap: 2px; min-width: 0; }
.item-title code { color: var(--ink-3); overflow-wrap: anywhere; }
.item-val { text-align: right; display: grid; gap: 1px; justify-items: end; }
.item-val .v { font-family: var(--f-mono); font-weight: 600; font-size: 1rem; white-space: nowrap; }
.item-val .d { font-size: 0.74rem; color: var(--ink-3); white-space: nowrap; }
.ev { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.ev i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.modes { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.modes button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.modes button:hover { background: var(--sunk); color: var(--ink); }
.modes button[aria-pressed="true"] { background: var(--sunk); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt:hover { border-color: var(--line-2); }
.opt input { margin: 0; accent-color: var(--accent); }
.opt.sel { border-color: var(--ink-3); background: var(--sunk); }
.opt .ov { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink-2); white-space: nowrap; }
.formula { font-family: var(--f-mono); font-size: 0.76rem; color: var(--ink-3); }
details.about { border-top: 1px solid var(--line); padding-top: 8px; }
details.about summary { cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 6px; }
details.about summary::-webkit-details-marker { display: none; }
details.about summary::before { content: "+"; font-family: var(--f-mono); width: 14px; color: var(--ink-3); }
details.about[open] summary::before { content: "−"; }
.about-body { display: grid; gap: 8px; padding: 10px 0 2px 20px; font-size: 0.88rem; color: var(--ink-2); max-width: 70ch; }
.about-body b { color: var(--ink); font-weight: 700; }
.srcs { display: grid; gap: 3px; font-size: 0.8rem; }
.srcs a, .srcs span { overflow-wrap: anywhere; }

/* ---------- devices ---------- */
.device { border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); }
.device > .dev-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.dev-type { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--ink); color: var(--surface); }
.device .dev-body { padding: 14px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); background: var(--paper); border-radius: 0 0 12px 12px; }
.device .dev-body .item { background: var(--surface); }

/* ---------- loss groups ---------- */
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 2px 0; flex-wrap: wrap; }
.group-head b { font-family: var(--f-mono); font-size: 0.86rem; }

/* ---------- results ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; }
.tile .lbl { font-size: 0.8rem; color: var(--ink-2); }
.tile .val { font-family: var(--f-display); font-stretch: 105%; font-weight: 800; font-size: 1.75rem; line-height: 1.05; }
.tile .val small { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
.tile .sub { font-family: var(--f-mono); font-size: 0.76rem; color: var(--ink-3); }
.tile.key { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
table.t th, table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t thead th { font-size: 0.76rem; color: var(--ink-2); font-weight: 700; background: var(--sunk); position: sticky; top: 0; }
table.t td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.t td.txt { font-family: var(--f-body); white-space: normal; min-width: 180px; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.hl td { background: var(--accent-wash); }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 200px) minmax(0, 1fr) 64px; gap: 10px; align-items: center; }
.bar-row .bl { font-size: 0.86rem; min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.bar-row .bl small { display: block; color: var(--ink-3); font-size: 0.74rem; }
.bar-track { display: flex; gap: 2px; height: 14px; align-items: stretch; }
.bar-track span { display: block; height: 100%; border-radius: 0; }
.bar-track span:last-child { border-radius: 0 4px 4px 0; }
.bar-row .bv { font-family: var(--f-mono); font-size: 0.8rem; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.reduce { display: grid; gap: 8px; counter-reset: r; }
.reduce li { list-style: none; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); counter-increment: r; }
.reduce li::before { content: counter(r); font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; color: var(--accent-ink); }

.checks { display: grid; gap: 8px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }

.chart .ax { stroke: var(--line-2); stroke-width: 1; }

.chart .mk { stroke: var(--accent); stroke-width: 2; }

.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 0.78rem; padding: 6px 9px; border-radius: 6px; max-width: 260px; font-family: var(--f-body); line-height: 1.35; box-shadow: var(--shadow); }

.footer-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap; }

/* ---------- overlay ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 18, 22, 0.45); display: grid; place-items: start center; padding: calc(env(safe-area-inset-top, 0px) + 56px) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.sheet-panel { width: min(640px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }

.plist { display: grid; gap: 6px; }

.status { font-size: 0.82rem; color: var(--ink-2); min-height: 1.2em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- bottom bar (narrow) ---------- */
.bottombar { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .frame { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
  .side { display: none; }
  .sheet { padding-right: max(28px, env(safe-area-inset-right, 0px)); }
  .bottombar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); align-items: center; gap: 14px; }
  .bb-fig { display: grid; gap: 0; min-width: 0; }

  .bb-fig .v { font-family: var(--f-mono); font-weight: 600; font-size: 0.95rem; white-space: nowrap; }

}
@media (max-width: 760px) {
  :root { --top-h: 52px; }
  body { font-size: 15px; }
  .frame { display: block; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); z-index: 15; max-height: none; overflow-x: auto; overflow-y: hidden; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .chain { display: flex; gap: 6px; width: max-content; }
  .chain::before, .chain .grp, .rail-foot { display: none; }
  .stage-btn { grid-template-columns: auto auto; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; gap: 8px; }
  .stage-btn .node { display: none; }
  .stage-btn[aria-current="step"] { background: var(--ink); border-color: var(--ink); }
  .stage-btn[aria-current="step"] .stage-label, .stage-btn[aria-current="step"] .stage-sig { color: var(--surface); }
  .stage-label { font-size: 0.84rem; white-space: nowrap; }
  .sheet { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); }
  h2 { font-size: 1.35rem; }
  .brand-sub, .brand-name, .proj .tag { display: none; }
  .top-in { gap: 10px; }
  .item-val .d { white-space: normal; }
  .dev-head > div { flex: 1 1 140px !important; width: auto !important; min-width: 0 !important; }
  .btn .bt { display: none; }
  .item-head { grid-template-columns: minmax(0, 1fr); }
  .item-val { text-align: left; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; min-width: 0; }
  .bar-row { grid-template-columns: minmax(0, 1fr) 56px; }
  .bar-row .bl { grid-column: 1 / -1; }
  .reduce li { grid-template-columns: 22px minmax(0, 1fr); }
  .reduce .rg { grid-column: 2; text-align: left; }
}

/* ---------- storage and firm supply ---------- */
.hours { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; max-width: 560px; }
.hours button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 6px 0; font-family: var(--f-mono); font-size: 0.76rem; color: var(--ink-2); cursor: pointer; }
.hours button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chart .ln.s1 { stroke: var(--c1); } .chart .ln.s2 { stroke: var(--c2); } .chart .ln.s3 { stroke: var(--c3); }
.chart .bar.s1 { fill: var(--c1); } .chart .bar.s2 { fill: var(--c2); } .chart .bar.s3 { fill: var(--c3); }
.chart .bar:hover { opacity: 0.85; }
.chart .p10 { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.legend .sw { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
.legend .sw.s1 { background: var(--c1); } .legend .sw.s2 { background: var(--c2); } .legend .sw.s3 { background: var(--c3); }
.legend .sw.p10k { background: var(--ink); height: 2px; }
@media (max-width: 760px) { .hours { grid-template-columns: repeat(8, minmax(0, 1fr)); } }

/* ---------- plant view ----------
   The drawing is the navigation: badges sit in two rows above and below the scene with leader
   lines to each part; the selected part's categories pop out as bubbles. The inspector holds
   the inputs (a sticky column on wide screens, a bottom sheet on narrow ones). */
body.pv-on .rail, body.pv-on .side, body.pv-on .bottombar { display: none !important; }
body.pv-on .frame { display: block; }
body.pv-on .sheet { padding: 16px max(20px, env(safe-area-inset-right, 0px)) 48px max(20px, env(safe-area-inset-left, 0px)); }
.vt { display: flex; background: var(--sunk); border-radius: 8px; padding: 3px; gap: 2px; }
.vt button { border: 0; background: transparent; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.vt button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }

.pv { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.pv-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pv-chip { border: 1px dashed var(--line-2); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.pv-chip:hover { border-color: var(--ink-3); }
.pv-chip[aria-pressed="true"] { border-style: solid; border-color: var(--ink); color: var(--ink); background: var(--sunk); }
.pv-tot { display: flex; gap: 6px 20px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
.pv-tot .bb-fig { display: grid; gap: 0; min-width: 0; }
.pv-tot .bb-fig .l { font-size: 0.7rem; color: var(--ink-3); white-space: nowrap; }
.pv-tot .bb-fig .v { font-family: var(--f-mono); font-weight: 600; font-size: 0.98rem; white-space: nowrap; }
.pv-tot .bb-fig .v small { font-size: 0.7rem; color: var(--ink-3); font-weight: 500; }
.pv-tot .bb-fig .v.ratio { color: var(--accent-ink); }
.pv-hz { width: 270px; }

.pv-body { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 16px; align-items: start; }
.pv-stage { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; }
.pv-insp { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 12px); max-height: calc(100vh - var(--top-h) - 24px); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.insp-in { padding: 16px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.insp-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; z-index: 3; background: var(--surface); margin: -16px -16px 0; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; }
.insp-top .grow { flex: 1; }
.crumbs { font-size: 0.78rem; color: var(--ink-3); font-family: var(--f-mono); }
.crumb { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }

.pv-stat { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.pv-stat > div { display: grid; }
.pv-stat b { font-family: var(--f-display); font-stretch: 105%; font-weight: 800; font-size: 1.45rem; line-height: 1.1; font-variant-numeric: tabular-nums; }

/* scene */
.pv-canvas.wide { position: relative; }
.pv-row { position: relative; }
.pv-scene { width: 100%; height: auto; display: block; color: var(--ink-2); overflow: visible; }

.pv-badge { position: absolute; width: max-content; max-width: 210px; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 7px; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 10px; background: color-mix(in srgb, var(--accent) calc(var(--heat) * 26%), var(--surface)); text-align: left; cursor: pointer; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); min-width: 0; transition: opacity 0.2s; }
.pv-badge:hover { border-color: var(--ink-3); }
.pv-badge.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.pv-badge.muted { opacity: 0.6; }

.pv-badge .bt, .pv-node .nt { display: grid; min-width: 0; }

.pv-badge .bm, .pv-node .bm { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ring { display: block; flex: none; }

.pv-links .lead.on { stroke: var(--accent); }
.pv-links .lead.bub { stroke: var(--accent); stroke-dasharray: 2 4; opacity: 0.8; }
.pv-links .lead-dot { fill: var(--line-2); }
.pv-links .lead-dot.on { fill: var(--accent); }
.has-sel .pv-links .lead:not(.on):not(.bub), .has-sel .pv-links .lead-dot:not(.on) { opacity: 0.3; }
.pv-bubbles { position: absolute; inset: 0; pointer-events: none; }
.pv-bub { position: absolute; pointer-events: auto; transform: translateX(-50%); display: grid; justify-items: center; align-content: start; gap: 4px; border: 0; background: transparent; padding: 0; cursor: pointer; width: max(var(--d), 116px); animation: pvpop 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.25) both; animation-delay: calc(var(--i) * 45ms); transform-origin: 50% calc(var(--d) / 2); }
.pv-bub .b-c { width: var(--d); height: var(--d); border-radius: 50%; display: flex; align-items: baseline; justify-content: center; padding-top: calc(var(--d) / 2 - 0.62em); gap: 1px; background: var(--surface); border: 2px solid var(--accent); box-shadow: var(--shadow); font-family: var(--f-mono); line-height: 1.05; text-align: center; font-variant-numeric: tabular-nums; }

.pv-bub:hover .b-c, .pv-bub.on .b-c { background: var(--accent-wash); }
.pv-bub.on .b-c { box-shadow: 0 0 0 4px var(--accent-wash), var(--shadow); }
.pv-bub.off .b-c { border-style: dashed; border-color: var(--ev-none); }
.pv-bub:focus-visible { outline: none; }
.pv-bub:focus-visible .b-c { outline: 2px solid var(--accent); outline-offset: 3px; }
.pv-bub.still { animation: none; }
@keyframes pvpop { from { opacity: 0; transform: translateX(-50%) scale(0.3); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
.pv-key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.74rem; color: var(--ink-3); padding: 10px 2px 0; align-items: center; }
.pv-key > span { display: inline-flex; align-items: center; gap: 5px; }
.pv-key .legend { font-size: 0.74rem; }
.heatk { width: 26px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--surface), color-mix(in srgb, var(--accent) 34%, var(--surface))); border: 1px solid var(--line-2); display: inline-block; }
.pv-crumbs { display: flex; align-items: center; gap: 10px; padding: 2px 0 8px; font-weight: 700; }

/* phone chain */
.pv-chain { list-style: none; margin: 0; padding: 0; display: grid; }
.pv-chain li { position: relative; padding: 0 0 10px; }
.pv-chain li:not(:last-child)::after { content: ""; position: absolute; left: 30px; top: 54px; bottom: 0; width: 2px; background: repeating-linear-gradient(to bottom, var(--line-2) 0 6px, transparent 6px 10px); z-index: 0; }
.pv-node { position: relative; z-index: 1; display: grid; grid-template-columns: 60px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 6px 10px 6px 0; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--accent) calc(var(--heat) * 26%), var(--surface)); text-align: left; cursor: pointer; }
.pv-node.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }

.pv-node .ico { display: grid; place-items: center; }

/* inspector */
.pv-list { display: grid; gap: 2px; }
.pv-lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px 36px; gap: 10px; align-items: center; padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; font-size: 0.86rem; }
.pv-lrow:hover { background: var(--sunk); }

.pv-setup-in { padding: 0 12px 12px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.pv-grps { display: grid; gap: 8px; }
.pv-grp { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.pv-grp.open { border-color: var(--line-2); background: var(--paper); }
.pv-grp.hot { border-color: var(--accent); }
.pv-ghd { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n c" "s s" "b b"; gap: 4px 10px; width: 100%; border: 0; background: transparent; padding: 10px 12px; text-align: left; cursor: pointer; border-radius: var(--r); }

<script>
/* WattOdds — energy yield uncertainty, source to meter.
   Copyright 2026 Nithish Seenivasagam (coderenewables.com)
   SPDX-License-Identifier: Apache-2.0 */
/* Calculation core. Pure functions, no DOM.
   Units: wind speed m/s, power MW, energy GWh/yr, uncertainties in percent (1.5 = 1.5 %). */
const Engine = (() => {
  'use strict';

  const Z = { P50: 0, P75: 0.6744898, P90: 1.2815516, P95: 1.6448536, P99: 2.3263479 };
  const PLEVELS = ['P50', 'P75', 'P90', 'P95', 'P99'];

  /* ---------- maths helpers ---------- */
  const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  function gamma(x) {
    if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
    x -= 1;
    let a = LANCZOS[0];
    const t = x + 7.5;
    for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
    return Math.sqrt(2 * Math.PI) * Math.pow(t, x + 0.5) * Math.exp(-t) * a;
  }
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const num = (x, d = 0) => (typeof x === 'number' && isFinite(x) ? x : (x === '' || x == null ? d : (isFinite(+x) ? +x : d)));

  function cholesky(M) {
    const n = M.length, L = M.map(() => new Array(n).fill(0));
    for (let i = 0; i < n; i++) {
      for (let j = 0; j <= i; j++) {
        let s = M[i][j];
        for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
        if (i === j) { if (s <= 1e-12) return null; L[i][j] = Math.sqrt(s); }
        else L[i][j] = s / L[j][j];
      }
    }
    return L;
  }

  /* Seeded RNG (mulberry32) with Box–Muller normals */
  function rng(seed) {
    let a = seed >>> 0, spare = null;
    const u = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const n = () => {
      if (spare !== null) { const s = spare; spare = null; return s; }
      let x, y, r;
      do { x = 2 * u() - 1; y = 2 * u() - 1; r = x * x + y * y; } while (r === 0 || r >= 1);
      const f = Math.sqrt(-2 * Math.log(r) / r);
      spare = y * f; return x * f;
    };
    return { u, n };
  }

  /* Weibull shape/scale from mean and standard deviation (method of moments) */
  function weibullFromMoments(mean, sd) {
    if (!(mean > 0) || !(sd > 0)) return null;
    const cv2 = (sd / mean) ** 2;
    const f = b => gamma(1 + 2 / b) / gamma(1 + 1 / b) ** 2 - 1 - cv2;
    let lo = 0.25, hi = 40;
    if (f(hi) > 0) return { k: hi, lambda: mean / gamma(1 + 1 / hi) };
    for (let i = 0; i < 80; i++) { const m = 0.5 * (lo + hi); if (f(m) > 0) lo = m; else hi = m; }
    const k = 0.5 * (lo + hi);
    return { k, lambda: mean / gamma(1 + 1 / k) };
  }

  /* ---------- air density, power curve, energy ---------- */
  function airDensity(elevation, tempC) {
    const p = 101325 * Math.pow(1 - 2.25577e-5 * num(elevation), 5.25588);
    return p / (287.05 * (num(tempC, 15) + 273.15));
  }

  function genericCurve(plant, rho) {
    const D = num(plant.rotorD, 150), Pr = num(plant.ratedMW, 3), cp = 0.46, m = 8;
    const area = Math.PI * D * D / 4;
    const cutIn = num(plant.cutIn, 3), cutOut = num(plant.cutOut, 25);
    return v => {
      if (v < cutIn || v > cutOut) return 0;
      const pa = 0.5 * rho * area * cp * v * v * v / 1e6;
      if (pa <= 0) return 0;
      return Math.pow(Math.pow(pa, -m) + Math.pow(Pr, -m), -1 / m);
    };
  }

  function parseCurve(text) {
    const pts = [];
    String(text || '').split(/\r?\n/).forEach(line => {
      const parts = line.trim().split(/[\s,;\t]+/).map(Number);
      if (parts.length >= 2 && isFinite(parts[0]) && isFinite(parts[1])) pts.push([parts[0], parts[1]]);
    });
    pts.sort((a, b) => a[0] - b[0]);
    return pts;
  }

  function customCurve(pts, rhoRef, rho) {
    const ratio = Math.cbrt(rho / (num(rhoRef, 1.225) || 1.225));
    return v => {
      const ve = v * ratio;
      if (!pts.length || ve < pts[0][0] || ve > pts[pts.length - 1][0]) return 0;
      for (let i = 1; i < pts.length; i++) {
        if (ve <= pts[i][0]) {
          const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
          return (y0 + (y1 - y0) * (ve - x0) / ((x1 - x0) || 1)) / 1000;
        }
      }
      return pts[pts.length - 1][1] / 1000;
    };
  }

  function curveFor(project) {
    const rho = project.site.rhoMode === 'entered' ? num(project.site.rho, 1.225) : airDensity(project.site.elevation, project.site.tempC);
    const pl = project.plant;
    if (pl.curveMode === 'custom') {
      const pts = parseCurve(pl.curveText);
      if (pts.length >= 4) return { fn: customCurve(pts, pl.curveRho, rho), rho, kind: 'custom', points: pts.length };
    }
    return { fn: genericCurve(pl, rho), rho, kind: 'generic', points: 0 };
  }

  /* Mean power (MW) of one turbine for a Weibull climate with the mean wind speed scaled by `scale` */
  function meanPower(curve, meanWs, k, scale = 1) {
    const A = meanWs * scale / gamma(1 + 1 / k);
    const dv = 0.05, vmax = 40;
    let s = 0;
    for (let v = dv / 2; v < vmax; v += dv) {
      const x = v / A;
      const f = (k / A) * Math.pow(x, k - 1) * Math.exp(-Math.pow(x, k));
      s += f * curve(v) * dv;
    }
    return s;
  }

  /* ---------- technology helpers ---------- */
  const techOf = project => (project && (project.tech === 'solar' || project.tech === 'hybrid') ? project.tech : 'wind');
  const forTech = (def, tech) => (tech === 'hybrid' ? (def.tech === 'both' || def.tech === 'hybrid') : ((def.tech || 'wind') === tech || def.tech === 'both'));
  /* where an item sits in a hybrid project's chain */
  function hybridStageOf(def) {
    const t = def.tech || 'wind';
    if (t === 'both') return def.stage === 'poi' ? 'poi' : 'hybrid';
    if (t === 'hybrid') return 'hybrid';
    if (t === 'solar' && def.stage === 'losses') return 'pvlosses';
    return def.stage;
  }
  const isRes = d => d === 'ws' || d === 'res';

  /* ---------- context shared by item calculations ---------- */
  function buildContext(project, lib) {
    const tech = techOf(project);
    const life = Math.max(1, Math.round(num(project.horizon && project.horizon.life, 25)));
    const iavId = tech === 'solar' ? 'ghi_iav' : 'ws_iav';
    const iavDefault = lib && lib.ITEM_BY_ID && lib.ITEM_BY_ID[iavId] ? lib.ITEM_BY_ID[iavId].def.v : (tech === 'solar' ? 2.5 : 4.0);
    const sigmaA = (() => { const s = (project.items || {})[iavId]; return s && s.mode === 'entered' ? Math.max(0, num(s.entered && s.entered.v, iavDefault)) : iavDefault; })();
    if (tech === 'solar') {
      const pv = project.pv || {};
      const dc = Math.max(0.01, num(pv.dcMWp, 1)), ac = Math.max(0.01, num(pv.acMW, 1));
      return {
        tech, life, sigmaA, desktop: false,
        solarSource: (project.setup && project.setup.solarSource) || 'satellite',
        dc, ac, dcac: dc / ac, mount: pv.mount || 'fixed', bifacial: !!pv.bifacial,
        ghi: Math.max(1, num(pv.ghi, 1800)), poaRatio: Math.max(0.5, num(pv.poaRatio, 1.1)),
        capacityMW: ac, nMeasLocations: 1, curve: null,
      };
    }
    const c = curveFor(project);
    const cl = project.climate, pl = project.plant, vt = project.vertical || {};
    const meanWs = num(cl.meanWs, 7), k = clamp(num(cl.k, 2), 1.1, 4);
    const hub = num(pl.hubH, 120);
    const alpha = num(vt.alpha, 0.2);
    const ctx = {
      tech, life, sigmaA,
      desktop: project.setup.dataSource === 'desktop',
      terrain: project.setup.terrain || 'moderate',
      hub, meanWs, k, alpha,
      rho: c.rho,
      nTurbines: Math.max(1, Math.round(num(pl.nTurbines, 1))),
      capacityMW: Math.max(0.1, num(pl.nTurbines, 1) * num(pl.ratedMW, 3)),
      vertical: vt,
      horizontal: project.horizontal || {},
      nMeasLocations: Math.max(1, (project.devices || []).filter(d => num(d.weight, 0) > 0).length),
    };
    ctx.wsAt = h => meanWs * Math.pow(Math.max(1, num(h, hub)) / hub, alpha);
    ctx.curve = c;
    return ctx;
  }

  /* ---------- evaluate one item from its definition and state ---------- */
  function evalItem(def, st, ctx) {
    const mode = st && st.mode ? st.mode : def.defaultMode;
    const inputs = (st && st.inputs) || {};
    let out = { sigma: 0, L: 0, iav: 0 };
    const asOut = v => (typeof v === 'object' && v !== null) ? { sigma: num(v.s ?? v.sigma, 0), L: num(v.L, 0), iav: num(v.iav, 0) } : { sigma: num(v, 0), L: 0, iav: 0 };
    try {
      if (mode === 'none') out = { sigma: 0, L: 0, iav: 0 };
      else if (mode === 'calc' && def.calc) out = asOut(def.calc.fn(fieldValues(def.calc.fields, inputs), ctx));
      else if (mode === 'desc' && def.desc) {
        const opts = def.desc.options;
        const i = clamp(Math.round(num(st && st.choice, def.desc.def || 0)), 0, opts.length - 1);
        const o = opts[i];
        out = asOut(typeof o.v === 'function' ? o.v(ctx, fieldValues(def.desc.fields || [], inputs)) : o.v);
      } else if (mode === 'entered') {
        const e = (st && st.entered) || {};
        if (def.domain === 'loss') out = { sigma: num(e.s, 0), L: num(e.L, 0), iav: num(e.iav, 0) };
        else out = { sigma: num(e.v, 0), L: 0, iav: 0 };
      } else {
        const d = def.def.v;
        out = asOut(typeof d === 'function' ? d(ctx) : d);
      }
    } catch (err) { out = { sigma: 0, L: 0, iav: 0, error: String(err && err.message || err) }; }
    out.sigma = Math.max(0, num(out.sigma, 0));
    out.iav = Math.max(0, num(out.iav, 0));
    out.L = clamp(num(out.L, 0), -30, 95);
    out.mode = mode;
    out.tier = TIER_OF_MODE[mode] || 'generic';
    return out;
  }
  function fieldValues(fields, inputs) {
    const o = {};
    (fields || []).forEach(f => { o[f.key] = f.type === 'select' ? (inputs[f.key] ?? f.def) : num(inputs[f.key], f.def); });
    return o;
  }
  const TIER_OF_MODE = { calc: 'calc', entered: 'site', desc: 'desc', default: 'generic', none: 'none' };
  const IEC_BASIS = { calc: 'other_calculation', entered: 'project_specific_assumption', desc: 'project_specific_assumption', default: 'generic assumption', none: 'not_considered' };

  /* ---------- build the uncertainty model (item level) ---------- */
  function buildModel(project, lib) {
    const ctx = buildContext(project, lib);
    const tech = ctx.tech;
    const items = [];
    const push = (def, st, extra) => {
      if (def.when && !def.when(ctx)) return;
      const r = evalItem(def, st, ctx);
      items.push(Object.assign({ key: def.id, id: def.id, def, name: def.name, stage: def.stage, cat: def.cat, sub: def.sub, domain: def.domain, time: def.time || 'static', dist: def.dist || 'normal', reducible: def.reducible !== false }, r, extra || {}));
    };
    const devices = [];
    if (tech === 'wind' && !ctx.desktop) {
      (project.devices || []).forEach(dv => {
        const w = Math.max(0, num(dv.weight, 0));
        const dctx = Object.assign({}, ctx, { device: dv, wsMeas: ctx.wsAt(dv.height) });
        const dItems = [];
        lib.items.filter(d => d.device === dv.type).forEach(def => {
          const r = evalItem(def, (dv.items || {})[def.id], dctx);
          const it = Object.assign({ key: dv.id + ':' + def.id, id: def.id, def, name: def.name, stage: def.stage, cat: def.cat, sub: def.sub, domain: 'ws', time: 'static', dist: 'normal', reducible: def.reducible !== false, deviceId: dv.id, deviceName: dv.name || (dv.type === 'lidar' ? 'Lidar' : 'Mast') }, r);
          items.push(it); dItems.push(it);
        });
        devices.push({ id: dv.id, name: dv.name, type: dv.type, w, items: dItems });
      });
    }
    lib.items.filter(d => !d.device && forTech(d, tech) && !(project._component && d.tech === 'both')).forEach(def => push(def, (project.items || {})[def.id]));
    const wsum = devices.reduce((s, d) => s + d.w, 0);
    devices.forEach(d => { d.wn = wsum > 0 ? d.w / wsum : 0; });
    return { ctx, tech, items, devices, deviceCorr: clamp(num(project.deviceCorr, 0.5), 0, 1) };
  }

  /* ---------- energy ---------- */
  function energy(project, model) {
    const ctx = model.ctx, pe = project.energy || {};
    let eff = 1;
    model.items.filter(i => i.domain === 'loss' && i.time !== 'horizon').forEach(i => { eff *= (1 - i.L / 100); });
    const entered = pe.p50Mode === 'entered' && num(pe.p50, 0) > 0;
    const sEntered = pe.sensMode === 'entered' && num(pe.sens, 0) > 0;
    if (model.tech === 'solar') {
      const refYield = ctx.ghi * ctx.poaRatio;                 // kWh/m² on the array ≈ reference yield, kWh/kWp
      const grossGWh = ctx.dc * refYield / 1000;              // MWp × kWh/kWp → GWh
      const netComputed = grossGWh * eff;
      const p50 = entered ? num(pe.p50, 0) : netComputed;
      const S = sEntered ? num(pe.sens, 0) : 1.0;
      return {
        tech: 'solar', grossGWh, netComputed, eff, p50, p50Source: entered ? 'entered' : 'computed',
        cf: p50 * 1000 / (ctx.ac * 8760), grossCf: grossGWh * 1000 / (ctx.ac * 8760),
        refYield, specYield: p50 * 1000 / ctx.dc, pr: eff,
        S, sCalc: 1.0, sSource: sEntered ? 'entered' : 'computed', table: null, linearTable: true,
      };
    }
    const curve = ctx.curve.fn;
    const p1 = meanPower(curve, ctx.meanWs, ctx.k, 1);
    const grossGWh = p1 * 8760 * ctx.nTurbines / 1000;
    const netComputed = grossGWh * eff;
    const p50 = entered ? num(pe.p50, 0) : netComputed;
    const d = 0.01;
    const up = meanPower(curve, ctx.meanWs, ctx.k, 1 + d), dn = meanPower(curve, ctx.meanWs, ctx.k, 1 - d);
    const sCalc = p1 > 0 ? (up - dn) / (2 * d * p1) : 1.8;
    const S = sEntered ? num(pe.sens, 0) : sCalc;
    const table = [];
    for (let w = 0.5; w <= 1.5001; w += 0.02) table.push([w, p1 > 0 ? meanPower(curve, ctx.meanWs, ctx.k, w) / p1 : w]);
    return {
      tech: 'wind', grossGWh, netComputed, eff, p50, p50Source: entered ? 'entered' : 'computed',
      cf: ctx.capacityMW > 0 ? p50 * 1000 / (ctx.capacityMW * 8760) : 0,
      grossCf: ctx.capacityMW > 0 ? grossGWh * 1000 / (ctx.capacityMW * 8760) : 0,
      S, sCalc, sSource: sEntered ? 'entered' : 'computed', table, linearTable: sEntered,
      rho: ctx.rho, curveKind: ctx.curve.kind, meanPowerMW: p1,
    };
  }

  /* ---------- analytical combination ---------- */
  const RES_STATIC = ['measurement', 'historical_wind_resource', 'vertical_extrapolation', 'horizontal_extrapolation', 'virtual_data',
    'irradiance_source', 'long_term_irradiance', 'plane_of_array'];
  const WS_STATIC = RES_STATIC;

  function climateSigma(N, model) {
    const it = model.items.find(i => i.id === 'climate_change');
    if (!it || it.mode === 'none') return 0;
    if (it.mode !== 'default') return it.sigma;
    // literature default: 0.5 % up to 10 years, rising linearly to 2 % at 25 years (capped at 2.5 %)
    const base = it.sigma;
    if (N <= 10) return base;
    return Math.min(base * 5, base * (1 + 3 * (N - 10) / 15));
  }

  /* loss over an N-year average for items whose loss grows each year (degradation): L is the yearly rate */
  function lossAt(it, N) {
    if (it.time !== 'horizon') return { L: it.L, s: it.sigma };
    const f = Math.max(0, (N - 1) / 2);
    return { L: it.L * f, s: it.sigma * f };
  }
  function p50Factor(model, N) {
    let f = 1;
    model.items.forEach(i => { if (i.domain === 'loss' && i.time === 'horizon') f *= 1 - lossAt(i, N).L / 100; });
    return f;
  }

  function corrMatrix(project, cats) {
    const R = cats.map((a, i) => cats.map((b, j) => (i === j ? 1 : 0)));
    const cc = project.catCorr || {};
    cats.forEach((a, i) => cats.forEach((b, j) => {
      if (i < j) {
        const v = clamp(num(cc[a + '|' + b] ?? cc[b + '|' + a], 0), -0.9, 0.95);
        R[i][j] = R[j][i] = v;
      }
    }));
    return R;
  }

  /* Total relative energy uncertainty (%) at horizon N, with optional per-item scale factors */
  function combine(project, model, en, N, scale) {
    const sc = k => (scale && scale[k] != null ? scale[k] : 1);
    const items = model.items;
    const devSig = model.devices.map(d => Math.sqrt(d.items.reduce((s, i) => s + (i.sigma * sc(i.key)) ** 2, 0)));
    let measDev2 = 0;
    model.devices.forEach((d, i) => model.devices.forEach((e, j) => {
      measDev2 += d.wn * e.wn * (i === j ? 1 : model.deviceCorr) * devSig[i] * devSig[j];
    }));
    const catSig = {};
    RES_STATIC.forEach(c => {
      let v = c === 'measurement' ? measDev2 : 0;
      items.filter(i => isRes(i.domain) && i.cat === c && !i.deviceId && i.time === 'static').forEach(i => { v += (i.sigma * sc(i.key)) ** 2; });
      catSig[c] = Math.sqrt(v);
    });
    const cats = RES_STATIC.filter(c => catSig[c] > 0);
    const R = corrMatrix(project, cats);
    let wsStatic2 = 0;
    cats.forEach((a, i) => cats.forEach((b, j) => { wsStatic2 += R[i][j] * catSig[a] * catSig[b]; }));
    wsStatic2 = Math.max(0, wsStatic2);
    let iav2 = 0;
    items.filter(i => isRes(i.domain) && i.time === 'annual').forEach(i => { iav2 += (i.sigma * sc(i.key)) ** 2 / N; });
    const cc = climateSigma(N, model) * (items.find(i => i.id === 'climate_change') ? sc('climate_change') : 1);
    const ws2 = wsStatic2 + iav2 + cc * cc;
    const S = en.S;
    let e2 = S * S * ws2;
    const terms = { wsStatic2, iav2, cc2: cc * cc, en2: 0, loss2: 0, lossIav2: 0 };
    items.forEach(i => {
      if (i.domain === 'en') { const v = (i.sigma * sc(i.key)) ** 2; e2 += v; terms.en2 += v; }
      if (i.domain === 'loss') {
        const la = lossAt(i, N);
        const eta = Math.max(0.05, 1 - la.L / 100);
        const s = la.s * sc(i.key) / eta, a = i.time === 'horizon' ? 0 : i.iav * sc(i.key) / eta;

  function pvalues(p50, sigma) {
    const o = {};

  /* Variance contributions per item at horizon N (sum = sigma^2) */
  function contributions(project, model, en, N, comb) {
    const S2 = en.S * en.S;
    const out = [];
    const { catSig, cats, R, devSig } = comb;
    const wsStatic2 = comb.terms.wsStatic2;
    const catShare = {};
    cats.forEach((a, i) => {

    model.devices.forEach((d, i) => model.devices.forEach((e, j) => { measDev2 += d.wn * e.wn * (i === j ? 1 : model.deviceCorr) * devSig[i] * devSig[j]; }));
    const devShare = model.devices.map((d, i) => {

    out.forEach(o => { o.share = tot > 0 ? o.variance / tot : 0; });

  }

  function horizonList(model) { return [1, 10, model.ctx.life]; }

  /* ---------- full analytical evaluation ---------- */
  function evaluate(project, lib) {
    if (project.tech === 'hybrid') return evaluateHybrid(project, lib);
    const model = buildModel(project, lib);
    const en = energy(project, model);
    const H = {};
    horizonList(model).forEach(N => {
      const c = combine(project, model, en, N);

  /* ---------- Monte Carlo ---------- */
  function interp(table, w) {

  /* loss and energy-item sampler: returns a function giving Π(sampled efficiency / mean efficiency) × Π(1 + energy error) */
  function itemSampler(items, N) {
    const enItems = items.filter(i => i.domain === 'en' && i.sigma > 0).map(i => i.sigma / 100);
    const losses = items.filter(i => i.domain === 'loss' && (i.sigma > 0 || i.iav > 0)).map(i => {

  function monteCarloHybrid(result, N, n, R) {

  const EXPORT_PTS = [[0.3, 14], [0.4, 6.67], [0.5, 1.98], [0.6, 0.63], [0.7, 0.18], [0.8, 0.04], [0.9, 0.005]];

  function evaluateHybrid(project, lib) {

      capacityMW: gridMW, rhoIav: clamp(num(hy.rhoIav, 0), -0.95, 0.95), rhoRes: clamp(num(hy.rhoRes, 0), -0.95, 0.95),

      shared.forEach(i => {

      const sumP90 = c.Ew * effSh * Math.max(0, 1 - Z.P90 * sw / 100) + c.Es * effSh * Math.max(0, 1 - Z.P90 * ss / 100);

    const reduce = [];
    items.forEach(it => {
      if (!it.reducible || it.mode === 'none' || (it.sigma <= 0 && it.iav <= 0)) return;
      const c = hcombine(focusN, { [it.key]: 0.5 });
      const p90 = focus.p50 * Math.max(0, 1 - Z.P90 * c.sigma / 100);
      reduce.push({ key: it.key, item: it, gainGWh: p90 - base90, gainPct: focus.p50 > 0 ? (p90 - base90) / focus.p50 * 100 : 0, newSigma: c.sigma });
    });

    const p50y1 = H[1].p50;
    const en = {
      tech: 'hybrid', p50: p50y1, eff: effSh, netComputed: (rw.en.netComputed + rs.en.netComputed) * effSh,
      p50Source: rw.en.p50Source === 'entered' || rs.en.p50Source === 'entered' ? 'entered' : 'computed',
      cf: p50y1 * 1000 / (gridMW * 8760), cfInstalled: p50y1 * 1000 / ((windMW + solarAC) * 8760),

      hybrid: true, tech: 'hybrid', wind: rw, solar: rs,
      model: { ctx, tech: 'hybrid', items, devices: rw.model.devices, deviceCorr: rw.model.deviceCorr },

})();

  function bessExampleProject() {

  /* fill any missing pieces in an older or imported project */

/* Hourly storage and firm-supply engine. Pure functions, no DOM.

   profile, scores demand-fulfilment rules, and runs a Monte Carlo over resource, weather sequence and
   battery uncertainties. Energies in MWh, power in MW. */
const Firm = (() => {
  'use strict';
  const HRS = 8760, DAYS = 365;
  const DIM = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

  const MONTH_START = (() => { const a = []; let d = 0; DIM.forEach(n => { a.push(d); d += n; }); return a; })();
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const num = (x, d = 0) => (typeof x === 'number' && isFinite(x) ? x : (x === '' || x == null ? d : (isFinite(+x) ? +x : d)));

  /* Illustrative seasonal patterns. "monsoon": June–August wind peak and monsoon cloud dip, as at many
     Indian sites. "flat": no seasonality. Replace with your own hourly profile when you have one. */
  const SEASONS = {
    monsoon: {
      solarClear: [0.95, 0.95, 0.93, 0.90, 0.88, 0.72, 0.58, 0.60, 0.72, 0.88, 0.93, 0.95],
      solarVar: [0.06, 0.06, 0.07, 0.08, 0.10, 0.22, 0.28, 0.28, 0.22, 0.10, 0.07, 0.06],
      wind: [0.80, 0.80, 0.85, 0.95, 1.15, 1.35, 1.40, 1.30, 1.05, 0.80, 0.75, 0.80],
    },
    flat: {
      solarClear: new Array(12).fill(0.85), solarVar: new Array(12).fill(0.12), wind: new Array(12).fill(1),
    },
  };

  const COMP_LABEL = { wind: 'Wind', solar: 'Solar', hybrid: 'Shared' };
  const TERRAIN = [['flat', 'Flat'], ['simple', 'Simple'], ['moderate', 'Moderate'], ['complex', 'Complex'], ['vcomplex', 'Very complex']];
  const stageDef = id => Lb.STAGES.find(s => s.id === id);
  const stageName = id => { const s = stageDef(id); return s ? (isHybrid() && s.nameHybrid ? s.nameHybrid : s.name) : id; };
  const hzLabel = () => (state.view.horizon === 1 ? '1-yr' : state.view.horizon === 'life' ? lifeN() + '-yr' : '10-yr');
  const lifeN = () => Math.max(1, Math.round(+state.horizon.life || 25));

  /* ---------- state persistence ---------- */
  function loadLocal() {
    try { const s = localStorage.getItem(LS_KEY); if (s) { const o = JSON.parse(s); if (o && o.state) return o; } } catch (e) { /* storage unavailable */ }
    return null;
  }
  let saveTimer = 0;
  function saveLocal() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify({ state, stage })); } catch (e) { /* ignore */ } }, 500);
  }
  function touch() { state.meta.updated = new Date().toISOString(); saveLocal(); updateSaveTag(); }

  /* ---------- evaluation and scheduling ---------- */
  function recompute() { result = E.evaluate(state, Lb); }
  let raf = 0;
  function scheduleLive() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; recompute(); updateLive(); }); }
  function rerender() { recompute(); renderStage(pvMode()); updateChrome(); }

  /* ---------- shell ---------- */
  // WattOdds mark: a dot plot of outcomes; the one dot beyond the line (1 in 11) is the tail below P90
  const BRAND_MARK = '<svg class="brand-mark" width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><circle cx="10" cy="50" r="5" fill="var(--accent)" fill-opacity="0.32"/><circle cx="21" cy="50" r="5" fill="var(--accent)"/><circle cx="21" cy="39" r="5" fill="var(--accent)"/><circle cx="32" cy="50" r="5" fill="var(--accent)"/><circle cx="32" cy="39" r="5" fill="var(--accent)"/><circle cx="32" cy="28" r="5" fill="var(--accent)"/><circle cx="32" cy="17" r="5" fill="var(--accent)"/><circle cx="43" cy="50" r="5" fill="var(--accent)"/><circle cx="43" cy="39" r="5" fill="var(--accent)"/><circle cx="43" cy="28" r="5" fill="var(--accent)"/><circle cx="54" cy="50" r="5" fill="var(--accent)"/><path d="M15.5,10 V58" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" fill="none"/></svg>';

  function renderShell() {
    document.getElementById('app').innerHTML = `
      <header class="top"><div class="top-in">
        <div class="brand">${BRAND_MARK}<div><div class="brand-name">Watt<span class="odds">Odds</span></div><div class="brand-sub">energy yield uncertainty · source to meter</div></div></div>
        <div class="proj"><span class="proj-name" id="projName"></span><span id="projTags"></span></div>
        <div class="actions">
          <div class="vt" role="group" aria-label="View"><button data-act="mode" data-val="plant" aria-pressed="${pvMode()}" aria-label="Plant view" title="Plant view"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13h12M5 13V6M5 6l-3-2M5 6l3-2M5 6v-3M11 13V9h3v4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="bt">Plant view</span></button><button data-act="mode" data-val="steps" aria-pressed="${!pvMode()}" aria-label="Step by step" title="Step by step"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h9M4 8h9M4 13h9" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="1.8" cy="3" r="1" fill="currentColor"/><circle cx="1.8" cy="8" r="1" fill="currentColor"/><circle cx="1.8" cy="13" r="1" fill="currentColor"/></svg><span class="bt">Step by step</span></button></div>
          <button class="btn" data-act="projects" aria-label="Projects"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h4l1.5 1.5H14v8H2z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="bt">Projects</span></button>
          <button class="btn" data-act="export" aria-label="Export"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="bt">Export</span></button>
        </div>
      </div></header>
      <div class="frame">
        <nav class="rail" aria-label="Uncertainty chain"><ul class="chain" id="chain"></ul><div class="rail-foot" id="railFoot"></div></nav>
        <main class="sheet" id="sheet" tabindex="-1"></main>
        <aside class="side" id="side" aria-label="Live result"></aside>
      </div>
      <div class="bottombar" id="bottombar"></div>`;
  }

  function renderRail() {
    const r = result;
    const li = id => {
      const s = stageDef(id);
      let sig = '';
      if (id === 'bess') sig = fx(+state.bess.energyMWh / Math.max(0.01, +state.bess.powerMW), 1) + ' h';
      else if (id === 'supply') sig = firm.res && firm.key === firmKey() ? fx(firm.res.pMeet * 100, 0) + '%' : '–';
      else if (chainOf().includes(id)) {
        if (ptech() !== 'solar' && state.setup.dataSource === 'desktop' && ONSITE_ONLY.includes(id)) sig = 'in atlas';
        else sig = r.stages[id] ? fx(r.stages[id].sigma, 1) + '%' : '0.0%';
      } else if (id === 'results') sig = fx(r.focus.pv.P90 / r.focus.p50 * 100, 1) + '%';
      else if (id === 'project') sig = fx(r.en.p50, 0) + ' GWh';
      return `<li><button class="stage-btn" data-stage="${id}" ${stage === id ? 'aria-current="step"' : ''}><span class="node"><i></i></span><span class="stage-label">${esc(stageName(id))}</span><span class="stage-sig" id="sig-${id}">${sig}</span></button></li>`;
    };
    const base = Lb.CHAINS[ptech()];
    const chainHtml = (isHybrid()
      ? `<li class="grp">Wind · mast to meter</li>${base.filter(id => compOfStage(id) === 'wind').map(li).join('')}<li class="grp">Solar · sun to meter</li>${base.filter(id => compOfStage(id) === 'solar').map(li).join('')}<li class="grp">Shared · connection</li>${['hybrid', 'poi'].map(li).join('')}`
      : `<li class="grp">Chain · ${ptech() === 'solar' ? 'sun' : 'mast'} to meter</li>${base.map(li).join('')}`)
      + (hasBess() ? `<li class="grp">Storage · firm supply</li>${['bess', 'supply'].map(li).join('')}` : '');
    $('#chain').innerHTML = `<li class="grp">Set-up</li>${li('project')}${chainHtml}<li class="grp">Outcome</li>${li('results')}`;
    $('#railFoot').innerHTML = `Values beside each stage are its share of the energy uncertainty (σ, ${hzLabel()}). Results shows P90 as a share of P50.`;
  }

  function hzButtons() {
    const h = state.view.horizon;
    return `<div class="hz" role="group" aria-label="Evaluation period">
      <button data-hz="1" aria-pressed="${h === 1}">1 year</button>
      <button data-hz="10" aria-pressed="${h === 10 || h == null}">10 years</button>
      <button data-hz="life" aria-pressed="${h === 'life'}">${lifeN()} years</button></div>`;
  }

  function mixBar(mix, tall) {
    const parts = TIER_ORDER.filter(t => mix[t] > 0.0005).map(t => `<span class="${TIER[t].cls}" style="flex:${mix[t]}" data-tip="${esc(TIER[t].label)}: ${fx(mix[t] * 100, 0)} % of variance"></span>`).join('');
    return `<div class="mixbar" style="${tall ? 'height:14px' : ''}" role="img" aria-label="${TIER_ORDER.map(t => TIER[t].label + ' ' + fx(mix[t] * 100, 0) + '%').join(', ')}">${parts}</div>`;
  }
  function legend() {
    return `<div class="legend">${TIER_ORDER.map(t => `<span><i class="${TIER[t].cls}"></i>${TIER[t].label}</span>`).join('')}</div>`;
  }

  function renderSide() {
    const r = result, pv = r.focus.pv, p50 = r.focus.p50;
    $('#side').innerHTML = `<div class="res-card">
      ${hzButtons()}
      <div class="hero"><span class="lbl">P90, ${hzLabel()} average</span>
        <span class="big">${fx(pv.P90, 1)} <small>GWh/yr</small></span>
        <span class="sub"><span class="ratio">${fx(pv.P90 / p50 * 100, 1)} %</span> of P50 · σ ${fx(r.focus.sigma, 2)} %</span></div>
      <dl class="kv">
        <dt>${hasSolar() ? 'P50 year 1' : 'P50 net at POI'}</dt><dd>${fx(r.en.p50, 1)}</dd>
        ${hasSolar() && r.focusN > 1 ? `<dt>P50, ${hzLabel()} average</dt><dd>${fx(p50, 1)}</dd>` : ''}
        <dt>P75</dt><dd>${fx(pv.P75, 1)}</dd>
        <dt>P95</dt><dd>${fx(pv.P95, 1)}</dd>
        <dt>P99</dt><dd>${fx(pv.P99, 1)}</dd>
        <dt>Net CUF (P50)${isHybrid() ? ', on connection' : ''}</dt><dd>${fx(r.en.cf * 100, 1)} %</dd>
        ${isHybrid() ? `<dt>Portfolio gain at P90</dt><dd>+${fx(r.focus.portfolioGain, 1)}</dd>` : ''}
      </dl>
      <div class="stack" style="gap:8px"><h4>Evidence behind the total</h4>${mixBar(r.mix)}${legend()}
        ${r.none.length ? `<p class="side-note">${r.none.length} item${r.none.length > 1 ? 's' : ''} excluded.</p>` : ''}</div>
      <button class="btn" data-stage="results">Open results</button>
      <p class="side-note">GWh/yr. P-values assume a normal distribution of the combined uncertainty; Results also runs a Monte Carlo check.</p>
    </div>`;
    $('#bottombar').innerHTML = `
      <div class="bb-fig"><span class="l">P50${hasSolar() && r.focusN > 1 ? ' ' + hzLabel() : ''}</span><span class="v">${fx(p50, 1)}</span></div>
      <div class="bb-fig"><span class="l">P90 ${hzLabel()}</span><span class="v">${fx(pv.P90, 1)}</span></div>
      <div class="bb-fig"><span class="l">P90/P50</span><span class="v ratio">${fx(pv.P90 / p50 * 100, 1)} %</span></div>
      <span class="grow"></span>
      ${stage === 'results' ? '' : '<button class="btn small" data-stage="results">Results</button>'}`;
  }

  function updateSaveTag() {
    const n = $('#projName'); if (!n) return;
    n.textContent = state.meta.name || 'Untitled project';
    const saved = cloud.savedStamp && cloud.savedStamp === state.meta.updated;
    $('#projTags').innerHTML = (state.meta.example ? '<span class="tag">Example values</span> ' : '') +
      `<span class="tag save">${saved ? 'Saved' : 'Not saved to projects'}</span>`;
  }

  function updateChrome() { renderRail(); renderSide(); updateSaveTag(); }

  /* ---------- live updates (no re-render) ---------- */
  function bessItems() {
    return Lb.ITEMS.filter(d => d.tech === 'bess').map(d => Object.assign({ key: d.id, id: d.id, def: d, name: d.name, stage: 'bess', cat: d.cat, sub: d.sub, domain: 'bess', comp: 'bess' }, E.evalItem(d, (state.items || {})[d.id], {})));
  }
  function itemMap() { const m = {}; result.model.items.forEach(i => { m[i.key] = i; }); if (hasBess()) bessItems().forEach(i => { m[i.key] = i; }); return m; }
  function valueText(it) {
    const S = it && it._S != null ? it._S : (C().en.S || 1);
    if (!it) return { v: '–', d: '' };
    if (it.mode === 'none') return { v: 'Excluded', d: '' };
    if (it.domain === 'ws' || it.domain === 'res') return { v: pct(it.sigma), d: (it.domain === 'res' ? 'irradiance' : 'wind speed') + ' · ≈ ' + pct(S * it.sigma) + ' energy' };
    if (it.domain === 'en') return { v: pct(it.sigma), d: 'energy' };
    if (it.domain === 'bess') { const u = it.def.bunit || { L: '%', s: '%' }; return { v: `${fx(it.L, it.L !== 0 && Math.abs(it.L) < 10 ? 1 : 0)} ${u.L}`, d: `σ ${fx(it.sigma, 1)} ${u.s} · used in the hourly simulation` }; }
    if (it.time === 'horizon') { const la = E.lossAt(it, result.focusN); return { v: `${fx(it.L, 2)} %/yr`, d: `σ ${fx(it.sigma, 2)} %/yr · ${hzLabel()}: ${fx(la.L, 1)} % ± ${fx(la.s, 1)}` }; }
    const eta = Math.max(0.05, 1 - it.L / 100);
    return { v: it.L < 0 ? `${fx(-it.L, 1)} % gain` : `${fx(it.L, 1)} % loss`, d: `σ ${fx(it.sigma, 2)} pts · ≈ ${pct(it.sigma / eta)} energy${it.iav > 0 ? ' · yearly ±' + fx(it.iav, 1) : ''}` };
  }
  function optPreview(def, st, i, ctx) {
    const r = E.evalItem(def, Object.assign({}, st, { mode: 'desc', choice: i }), ctx);
    if (def.domain === 'bess') return `${fx(r.L, 1)} ± ${fx(r.sigma, 1)}`;
    if (def.domain === 'loss') return def.time === 'horizon' ? `${fx(r.L, 2)} ± ${fx(r.sigma, 2)} %/yr` : r.L < 0 ? `+${fx(-r.L, 1)} % ± ${fx(r.sigma, 1)}` : `${fx(r.L, 1)} % ± ${fx(r.sigma, 1)}`;
    return pct(r.sigma);
  }
  function ctxFor(path) {
    const ctx = C().model.ctx;
    const m = /^devices\.(\d+)\./.exec(path);
    if (m) { const dv = state.devices[+m[1]]; return Object.assign({}, ctx, { device: dv, wsMeas: ctx.wsAt(dv.height) }); }
    return ctx;
  }

  function updateLive() {
    if (pvMode()) { pvSummarise(); comp = pvComp(); } else comp = compOfStage(stage);
    const map = itemMap();
    $$('[data-live]').forEach(el => {
      const [kind, ...rest] = el.dataset.live.split('|');
      const key = rest.join('|');
      if (kind === 'v') el.textContent = valueText(map[key]).v;
      else if (kind === 'd') el.textContent = valueText(map[key]).d;
      else if (kind === 't') { const it = map[key]; const t = TIER[it ? it.tier : 'generic']; el.innerHTML = `<i class="${t.cls}"></i>${t.label}`; }
      else if (kind === 'o') {
        const [path, i] = key.split('#');
        const st = getPath(state, path); const id = path.split('.').pop();
        el.textContent = optPreview(Lb.ITEM_BY_ID[id], st, +i, ctxFor(path));
      } else if (LIVE[kind]) el.innerHTML = LIVE[kind](key);
    });
    renderRail(); renderSide();
    if (pvMode()) pvRefresh();
    else if (stage === 'results') { renderStage(true); }
  }

  /* live fragments by name */
  const LIVE = {
    stagestat: id => stageStat(id),
    devsig: i => { const c = C().focus.comb; return c.devSig[+i] != null ? pct(c.devSig[+i]) + ' wind speed' : '–'; },
    meassig: () => { const c = C().focus.comb; return `<b>${pct(c.catSig.measurement || 0)}</b> combined wind speed uncertainty · ≈ ${pct((c.catSig.measurement || 0) * C().en.S)} energy`; },
    rho: k => fx(CR(k).en.rho, 3) + ' kg/m³',
    vz: () => vzText(),
    nmeas: () => String(C().model.ctx.nMeasLocations),
    energy: () => energyKv(),
    sens: () => fx(C().en.S, 2),
    p50: k => fx(CR(k).en.p50, 1) + ' GWh/yr',
    computedP50: k => fx(CR(k).en.netComputed, 1) + ' GWh/yr',
    conn: () => connText(),
    hybsum: () => hybridSummary(),
    iavtable: () => iavTable(),
    lossgroup: k => { const [st, g] = k.split(':'); return lossGroupStat(g, st); },
    losstotal: () => lossTotal(),
    poisum: () => poiSummary(),
    curve: () => curveChart(),
    dcac: () => fx((+state.pv.dcMWp || 0) / Math.max(0.01, +state.pv.acMW || 0), 2),
    refyield: k => fx(CR(k).en.refYield, 0) + ' kWh/m²',
    prkv: () => prKv(),
    wsmeas: i => { const dv = state.devices[+i]; return dv ? fx(C().model.ctx.wsAt(dv.height), 2) + ' m/s' : '–'; },
  };

  /* ---------- form helpers ---------- */
  let fid = 0;
  const nid = () => 'f' + (++fid);
  function numField(o) {
    const id = nid(), v = getPath(state, o.path);
    return `<div class="field"><label for="${id}">${esc(o.label)}</label>
      <div class="inp"><input id="${id}" type="number" inputmode="decimal" step="${o.step || 'any'}" ${o.min != null ? `min="${o.min}"` : ''} ${o.max != null ? `max="${o.max}"` : ''} data-path="${o.path}" value="${esc(v ?? '')}" ${o.rerender ? 'data-rerender="1"' : ''}>${o.unit ? `<span class="unit">${esc(o.unit)}</span>` : ''}</div>
      ${o.hint ? `<span class="hint">${o.hint}</span>` : ''}</div>`;
  }
  function selField(o) {
    const id = nid(), v = String(getPath(state, o.path) ?? '');
    return `<div class="field"><label for="${id}">${esc(o.label)}</label><div class="inp"><select id="${id}" data-path="${o.path}">${o.options.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>${o.hint ? `<span class="hint">${o.hint}</span>` : ''}</div>`;
  }
  function txtField(o) {
    const id = nid(), v = getPath(state, o.path);
    return `<div class="field"><label for="${id}">${esc(o.label)}</label><input class="txt" id="${id}" type="text" data-path="${o.path}" data-kind="text" value="${esc(v ?? '')}">${o.hint ? `<span class="hint">${o.hint}</span>` : ''}</div>`;
  }
  function segField(o) {
    const v = String(getPath(state, o.path));
    return `<div class="field"><span class="lab">${esc(o.label)}</span><div class="seg" role="group" aria-label="${esc(o.label)}">${o.options.map(([k, l]) => `<button data-set="${o.path}" data-val="${esc(k)}" data-type="${o.type || 'str'}" aria-pressed="${String(k) === v}">${esc(l)}</button>`).join('')}</div>${o.hint ? `<span class="hint">${o.hint}</span>` : ''}</div>`;
  }

  /* ---------- item card ---------- */
  function sourcesHtml(ids) {
    return `<div class="srcs">${(ids || []).map(k => { const s = Lb.SOURCES[k]; if (!s) return ''; return s.u ? `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>` : `<span>${esc(s.t)}</span>`; }).join('')}</div>`;
  }
  function itemCard(def, path, key) {
    const st = getPath(state, path) || Lb.itemState(def);
    if (!getPath(state, path)) setPath(state, path, st);
    const it = itemMap()[key];
    const modes = ['calc', 'desc', 'entered', 'default', 'none'].filter(m => (m === 'calc' ? !!def.calc : m === 'desc' ? !!def.desc : true));
    const mode = st.mode;
    const vt = valueText(it);
    const tier = TIER[it ? it.tier : 'generic'];
    let body = '';
    if (mode === 'calc' && def.calc) {
      const fields = def.calc.fields.map(f => f.type === 'select'
        ? selField({ path: `${path}.inputs.${f.key}`, label: f.label, options: f.options })
        : numField({ path: `${path}.inputs.${f.key}`, label: f.label, unit: f.unit, step: f.step }));
      body = `${fields.length ? `<div class="grid2">${fields.join('')}</div>` : ''}<p class="formula">${esc(def.calc.note || '')}</p>`;
      if (def.stage === 'vertical') body += `<p class="hint" style="font-size:.78rem;color:var(--ink-3)">Uses the heights and shear set above.</p>`;
    } else if (mode === 'desc' && def.desc) {
      const fields = (def.desc.fields || []).map(f => selField({ path: `${path}.inputs.${f.key}`, label: f.label, options: f.options }));
      const ctx = ctxFor(path);
      const opts = def.desc.options;
      const name = 'r' + nid();
      body = `${fields.length ? `<div class="grid2">${fields.join('')}</div>` : ''}
        ${opts.length > 1 ? `<div class="opts" role="radiogroup" aria-label="${esc(def.name)}">${opts.map((o, i) => `
          <label class="opt ${+st.choice === i ? 'sel' : ''}"><input type="radio" name="${name}" data-choice="${path}" value="${i}" ${+st.choice === i ? 'checked' : ''}><span>${esc(o.label)}</span><span class="ov" data-live="o|${path}#${i}">${optPreview(def, st, i, ctx)}</span></label>`).join('')}</div>`
          : `<p class="computed">${esc(opts[0].label)}: <b data-live="v|${key}">${vt.v}</b></p>`}`;
    } else if (mode === 'entered') {
      if (def.domain === 'bess') {
        const u = def.bunit || {}, lb = def.labels || {};
        body = `<div class="grid2">${numField({ path: `${path}.entered.L`, label: lb.L || 'Value', unit: u.L, step: 0.1 })}${numField({ path: `${path}.entered.s`, label: lb.s || 'Uncertainty (σ)', unit: u.s, step: 0.1 })}</div>`;
      } else if (def.domain === 'loss') {
        const hz = def.time === 'horizon';
        body = `<div class="grid2">${numField({ path: `${path}.entered.L`, label: hz ? 'Rate' : def.id === 'bifacial' ? 'Loss (negative for a gain)' : 'Loss', unit: hz ? '%/yr' : '%', step: hz ? 0.05 : 0.1 })}${numField({ path: `${path}.entered.s`, label: hz ? 'Uncertainty of the rate (σ)' : 'Uncertainty of the loss (σ)', unit: hz ? '%/yr' : 'pts', step: 0.05 })}${def.hasIav ? numField({ path: `${path}.entered.iav`, label: 'Year-to-year variability', unit: 'pts', step: 0.05 }) : ''}</div>`;
      } else {
        const lab = (def.entered && def.entered.label) || (def.domain === 'ws' ? 'Standard uncertainty (σ) as a share of wind speed' : def.domain === 'res' ? 'Standard uncertainty (σ) as a share of irradiation' : 'Standard uncertainty (σ) as a share of energy');
        body = `<div class="grid2">${numField({ path: `${path}.entered.v`, label: lab, unit: '%', step: 0.05 })}</div><p class="formula">Enter one standard deviation (k = 1). Divide a 95 % (k = 2) figure by 2.</p>`;
      }
    } else if (mode === 'default') {
      body = `<p class="computed">Generic value: <b data-live="v|${key}">${vt.v}</b>. ${esc(def.info && def.info.values || '')}</p>`;
    } else {
      body = `<p class="note">Excluded from the total. Keep this only if the item really does not apply to your project.</p>`;
    }
    const info = def.info || {};
    return `<section class="item ${mode === 'none' ? 'off' : ''}" id="it-${esc(key)}">
      <div class="item-head">
        <div class="item-title"><h3>${esc(def.name)}</h3><code>${esc(def.cat)} / ${esc(def.sub)}</code></div>
        <div class="item-val"><span class="v" data-live="v|${key}">${vt.v}</span><span class="d" data-live="d|${key}">${vt.d}</span><span class="ev" data-live="t|${key}"><i class="${tier.cls}"></i>${tier.label}</span></div>
      </div>
      <div class="modes" role="group" aria-label="How to set this item">${modes.map(m => `<button data-mode="${path}" data-key="${esc(key)}" data-val="${m}" aria-pressed="${mode === m}">${MODE_LABEL[m]}</button>`).join('')}</div>
      ${body}
      ${def.note ? `<p class="formula">${esc(def.note)}</p>` : ''}
      <details class="about"><summary>What this is and how to reduce it</summary><div class="about-body">
        ${info.what ? `<p><b>What it is.</b> ${esc(info.what)}</p>` : ''}
        ${info.drives ? `<p><b>What drives it.</b> ${esc(info.drives)}</p>` : ''}
        ${info.reduce ? `<p><b>How to reduce it.</b> ${esc(info.reduce)}</p>` : ''}
        ${info.values ? `<p><b>Where the numbers come from.</b> ${esc(info.values)}</p>` : ''}
        ${sourcesHtml(def.src)}
      </div></details>
    </section>`;
  }
  const stageItems = stageId => (stageId === 'bess' ? Lb.ITEMS.filter(d => d.tech === 'bess') : Lb.ITEMS.filter(d => !d.device && d.tech !== 'bess' && (isHybrid() ? E.hybridStageOf(d) === stageId : d.stage === stageId && E.forTech(d, tech()))));
  const ctxOfDef = d => (d.tech === 'bess' ? {} : isHybrid() ? (d.tech === 'both' || d.tech === 'hybrid' ? result.model.ctx : result[d.tech === 'solar' ? 'solar' : 'wind'].model.ctx) : result.model.ctx);
  const cardsFor = (stageId, filter) => stageItems(stageId).filter(d => (!filter || filter(d)) && (!d.when || d.when(ctxOfDef(d)))).map(d => itemCard(d, `items.${d.id}`, d.id)).join('');

  /* ---------- stage header ---------- */
  function stageStat(id) {
    const s = result.stages[id];
    const tot = result.focus.sigma ** 2;
    if (!s) return `<span>No uncertainty in this stage yet.</span>`;
    const mix = {}; TIER_ORDER.forEach(t => { mix[t] = s.variance > 0 ? s.tiers[t] / s.variance : 0; });
    return `<div class="stage-stat"><div><b>${pct(s.sigma)}</b> <span>energy uncertainty (σ, ${hzLabel()})</span></div><div><b>${fx(tot > 0 ? s.variance / tot * 100 : 0, 0)} %</b> <span>of the total variance</span></div></div>
      <div style="max-width:420px;display:grid;gap:6px">${mixBar(mix)}</div>`;
  }
  function stageHead(id) {
    const s = stageDef(id);
    const n = chainOf().indexOf(id);
    const ref = isSolar() ? (s.ref ? `<span>IEA PVPS Task 13 basis · ${esc(s.ref)}</span>` : '') : (s.iec ? `<span>IEC 61400-15-2 · ${esc(s.iec)}</span>` : '');
    const eyebrow = n >= 0 ? `<span>Stage ${n + 1} of ${chainOf().length}</span>${ref}` : (id === 'project' ? `<span>Set-up · ${{ wind: 'wind', solar: 'solar PV', hybrid: 'hybrid wind + solar' }[ptech()]}</span>` : '<span>Outcome</span>');
    const blurb = (isHybrid() && !comp && s.blurbHybrid) || (isHybrid() && comp === 'wind' && s.blurbHybrid) || (isSolar() && s.blurbSolar) || s.blurb;
    return `<div class="stage-head"><div class="eyebrow">${eyebrow}</div><h2>${esc(stageName(id))}</h2><p class="stage-blurb">${esc(blurb)}</p>${n >= 0 && id !== 'bess' && id !== 'supply' ? `<div data-live="stagestat|${id}">${stageStat(id)}</div>` : ''}</div>`;
  }
  function stageNav(id) {
    const order = ['project', ...chainOf(), 'results'];
    const i = order.indexOf(id), prev = order[i - 1], next = order[i + 1];
    return `<div class="footer-nav">${prev ? `<button class="btn" data-stage="${prev}">← ${esc(stageName(prev))}</button>` : '<span></span>'}${next ? `<button class="btn primary" data-stage="${next}">${esc(stageName(next))} →</button>` : ''}</div>`;
  }

  /* ---------- stages ---------- */
  function techPanel() {
    return `<section class="panel"><header><h3>Technology</h3></header>
